name: Build Xposed Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Xposed Debug APK (auto-signed)
        run: ./gradlew :app:assembleXposedDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/xposed/debug/app-xposed-debug.apk \
             Jist-xposed-${{ github.ref_name }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Jist-xposed-*.apk
          generate_release_notes: true
