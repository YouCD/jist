name: Build

on:
  push:
    branches: [ycd]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Android SDK
        id: cache-android
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            $ANDROID_HOME/platforms
            $ANDROID_HOME/build-tools
          key: android-sdk-${{ runner.os }}-36

      - name: Setup Android SDK
        if: steps.cache-android.outputs.cache-hit != 'true'
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME not set, installing cmdline-tools..."
            mkdir -p $HOME/android-sdk
            cd $HOME/android-sdk
            curl -sLo cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q cmdline-tools.zip
            mkdir -p cmdline-tools/latest
            mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/NOTICE.txt cmdline-tools/source.properties cmdline-tools/latest/
            echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
            echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          fi
          yes | sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" 2>&1 | tail -5

      - id: setup-gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-service-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-service-agree: "yes"

      - name: Build APK
        run: ./gradlew assembleDebug --build-cache --parallel --scan

      - name: Copy APK to build/Jist/
        run: |
          mkdir -p build/Jist
          cp app/build/outputs/apk/debug/app-debug.apk build/Jist/Jist.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jist-debug
          path: build/Jist/

      - name: Publish Build Scan URL
        if: always()
        run: |
          BUILD_SCAN_URL="${{ steps.setup-gradle.outputs.build-scan-url }}"
          if [ -n "$BUILD_SCAN_URL" ]; then
            echo "### Build Scan" >> $GITHUB_STEP_SUMMARY
            echo "[$BUILD_SCAN_URL]($BUILD_SCAN_URL)" >> $GITHUB_STEP_SUMMARY
          fi
