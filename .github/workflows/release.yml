name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew :app:assembleNormalDebug :app:assembleXposedDebug

      - name: Rename APKs
        run: |
          ls -la app/build/outputs/apk/normal/debug/app-normal-debug.apk
          ls -la app/build/outputs/apk/xposed/debug/app-xposed-debug.apk
          cp app/build/outputs/apk/normal/debug/app-normal-debug.apk \
             Jist-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/xposed/debug/app-xposed-debug.apk \
             Jist-xposed-${{ github.ref_name }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Jist-*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
