name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - id: setup-gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-service-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-service-agree: "yes"

      - name: Build Release APK
        run: ./gradlew assembleRelease --scan

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No keystore, skipping sign"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          BUILD_TOOLS=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            "$APK"
          rm -f /tmp/release.keystore

      - name: Publish Build Scan URL
        if: always()
        run: |
          BUILD_SCAN_URL="${{ steps.setup-gradle.outputs.build-scan-url }}"
          if [ -n "$BUILD_SCAN_URL" ]; then
            echo "### Build Scan" >> $GITHUB_STEP_SUMMARY
            echo "[$BUILD_SCAN_URL]($BUILD_SCAN_URL)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Get APK path
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename $APK)" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: notes
        run: |
          BUILD_SCAN_URL="${{ steps.setup-gradle.outputs.build-scan-url }}"
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v' | sed -n '2p')
          echo "body<<EOF" >> $GITHUB_OUTPUT
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Initial release." >> $GITHUB_OUTPUT
          else
            git log --pretty=format:"* %s (%h)" $PREVIOUS_TAG..HEAD >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi
          if [ -n "$BUILD_SCAN_URL" ]; then
            echo "" >> $GITHUB_OUTPUT
            echo "**Build Scan:** $BUILD_SCAN_URL" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            ${{ steps.apk.outputs.path }}
